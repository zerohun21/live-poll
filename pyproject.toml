[project]
# 프로젝트 이름과 버전. uv 가 이 정보를 보고 프로젝트를 관리한다.
name = "live-poll"
version = "0.1.0"
description = "실시간 투표 웹 서비스 LivePoll"
readme = "README.md"

# 이 프로젝트를 돌리는 데 필요한 최소 파이썬 버전
requires-python = ">=3.11"

# 우리가 직접 쓰는 라이브러리 목록.
#   fastapi          : 웹 API 를 만드는 프레임워크
#   uvicorn[standard]: FastAPI 앱을 실제로 실행해 주는 서버
#                      (대괄호 안의 standard 는 "성능 좋은 옵션들도 같이 깔아줘" 라는 뜻)
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
